# 机器损坏配置文件
# 此文件用于配置电力机器的损坏机制

# 全局默认配置
defaults:
  # 是否启用机器损坏机制
  enabled: true
  # Damage curve A: rate = A * ticks^2 / (B + ticks^2)
  damage_chance_scale: 7.5e-6
  # Damage curve B: larger values delay the curve approaching A
  damage_chance_exponent: 2.5e11
  # 最大损坏概率 (0.0-1.0)
  max_damage_chance: 7.5e-6

# 具体机器配置
# 格式: 机器ID: {配置项}
# 配置项可以覆盖默认值
machines:
  # 电力碎矿机
  ELECTRIC_ORE_GRINDER:
    damage_chance_scale: 7.5e-6
    damage_chance_exponent: 2.5e11
  # 电力冶炼炉
  ELECTRIC_SMELTERY:
    damage_chance_scale: 7.5e-6
    damage_chance_exponent: 2.5e11
  # 充电台
  CHARGING_BENCH:
    damage_chance_scale: 7.5e-6
    damage_chance_exponent: 2.5e11
  # 示例: 禁用特定机器的损坏机制
  # ELECTRIC_FURNACE:
  #   enabled: false
